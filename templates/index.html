<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gemini AR</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">

  <div class="header">
    <h1 class="header__title">Gemini AR</h1>
    <div class="credit">
      Made with 🧡 by <img src="{{ url_for('static', filename='img/dev-logo.png') }}" class="credit__logo" alt=""> Nitin Tiwari
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="stage__empty" id="stage-empty">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h1.8l.9-1.5A1.5 1.5 0 0 1 9.5 4.7h5a1.5 1.5 0 0 1 1.3.8L16.7 7h1.8A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.4"/></svg>
      <p>Tap the camera button to start</p>
    </div>

    <img class="stage__photo" id="stage-photo" hidden alt="">

    <model-viewer id="ar-viewer" class="stage__ar" hidden
      ar ar-modes="webxr scene-viewer quick-look"
      camera-controls auto-rotate
      alt="3D model of the added object">
      <button slot="ar-button" class="ar-cta">View in your room</button>
    </model-viewer>

    <div class="stage__loading" id="stage-loading" hidden>
      <div class="loader"></div>
      <p id="stage-loading-text">Working&hellip;</p>
    </div>

    <div class="stage__error" id="stage-error" hidden></div>
  </div>

  <div class="prompt-overlay" id="prompt-overlay" hidden>
    <div class="prompt-overlay__sheet">
      <label class="prompt-overlay__label" for="prompt-input">What should we add?</label>
      <div class="prompt-overlay__row">
        <input type="text" id="prompt-input" placeholder="e.g. Add a blue sofa" autocomplete="off">
        <button type="button" id="prompt-submit" class="icon-btn icon-btn--accent" aria-label="Generate">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h13.5M13 6l6.5 6-6.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="navbar" id="navbar">
    <button type="button" class="navbar__handle" id="navbar-toggle" aria-label="Toggle controls">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="navbar__group" id="navbar-group">
      <button type="button" class="navbar__btn" id="btn-camera" aria-label="Click Picture">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h1.8l.9-1.5A1.5 1.5 0 0 1 9.5 4.7h5a1.5 1.5 0 0 1 1.3.8L16.7 7h1.8A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button type="button" class="navbar__btn" id="btn-add" aria-label="Add Object" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="17" height="17" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="navbar__btn" id="btn-ar" aria-label="View AR/VR" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3.5 20 8v8l-8 4.5L4 16V8l8-4.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 8l8 4.5L20 8M12 12.5V21" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
